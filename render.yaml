services:
  - type: web
    name: neural-correct-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BEST_MODEL
        value: modern
      - key: ALLOWED_ORIGINS
        value: "*"
